<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granotes</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; color: #2a2230; }
  canvas#c { display: block; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .hud { position: fixed; top: 12px; display: flex; gap: 8px; align-items: center; }
  #info { left: 16px; font-size: 13px; line-height: 1.4; pointer-events: none; }
  #info #seed { opacity: .5; }
  #buttons { right: 16px; }
  button.px {
    font: inherit; font-size: 14px; padding: 8px 12px; cursor: pointer; color: #2a2230;
    background: #fff; border: 3px solid #2a2230; box-shadow: 3px 3px 0 #2a2230;
  }
  button.px:hover { background: #f1f7e8; }
  button.px:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2a2230; }
  #gallery { position: fixed; inset: 0; background: rgba(255,255,255,.97); overflow: auto; padding: 64px 16px 24px; box-sizing: border-box; }
  #gallery[hidden] { display: none; }
  #gallery .bar { position: fixed; top: 12px; right: 16px; display: flex; gap: 8px; }
  #gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-width: 1100px; margin: 0 auto; }
  #gallery .grid button { background: none; border: 2px solid transparent; padding: 0; cursor: pointer; }
  #gallery .grid button:hover { border-color: #2a2230; }
  #gallery .grid canvas { width: 100%; image-rendering: pixelated; display: block; }
  #votebar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 28px; }
  #votebar button.vote { font-size: 38px; line-height: 1; padding: 14px 36px; border-width: 4px; box-shadow: 5px 5px 0 #2a2230; }
  #votebar button.vote:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #2a2230; }
  #votebar button.vote:disabled { opacity: .5; cursor: default; }
  button.vote.on { background: #2a2230; color: #fff; }
  #learn { position: fixed; left: 16px; top: 58px; font-size: 13px; max-width: calc(100vw - 32px); }
  button.link { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: #2a2230; text-decoration: underline; text-underline-offset: 3px; }
  #learnPanel { margin-top: 8px; background: #fff; border: 3px solid #2a2230; box-shadow: 3px 3px 0 #2a2230; padding: 10px 12px; }
  #learnPanel[hidden] { display: none; }
  #learnPanel .cols { display: flex; gap: 24px; flex-wrap: wrap; }
  #learnPanel ul { margin: 6px 0 10px; padding-left: 18px; min-width: 150px; }
  #learnPanel li span { opacity: .5; }
  #gallery .cell { display: flex; flex-direction: column; align-items: stretch; }
  #gallery .cell .votes { display: flex; justify-content: center; gap: 6px; }
  #gallery .cell .votes button { font-size: 13px; padding: 2px 8px; border: 2px solid #2a2230; background: #fff; cursor: pointer; }
  #gallery .cell .votes button.on { background: #2a2230; }
  @media (max-width: 520px) { #info { top: 64px; } #learn { top: 104px; } #votebar button.vote { font-size: 30px; padding: 12px 28px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info" class="hud"><div><div id="name"></div><div id="seed"></div></div></div>
<div id="buttons" class="hud">
  <button id="galleryBtn" class="px" title="Galeria (G)">▦ Galeria</button>
  <button id="restart" class="px" title="Nova granota (R)">↻ Nova granota</button>
</div>
<div id="votebar">
  <button id="dislike" class="px vote" title="No m'agrada (N)">👎</button>
  <button id="like" class="px vote" title="M'agrada (M)">👍</button>
</div>
<div id="learn">
  <button id="learnBtn" class="link"></button>
  <div id="learnPanel" hidden>
    <div class="cols"><div><b>T'agrada</b><ul id="pos"></ul></div><div><b>No t'agrada</b><ul id="neg"></ul></div></div>
    <button id="forget" class="link">Oblidar-ho tot</button>
  </div>
</div>
<div id="gallery" hidden>
  <div class="bar">
    <button id="more" class="px">↻ Més</button>
    <button id="closeGal" class="px">✕</button>
  </div>
  <div class="grid"></div>
</div>
<script src="src/granota.js"></script>
<script src="src/gust.js"></script>
<script src="src/joc.js"></script>
</body>
</html>
