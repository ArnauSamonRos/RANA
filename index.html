<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granotes</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; color: #2a2230; }
  canvas#c { display: block; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .hud { position: fixed; top: 12px; display: flex; gap: 8px; align-items: center; }
  #info { left: 16px; font-size: 13px; line-height: 1.4; pointer-events: none; }
  #info #seed { opacity: .5; }
  #buttons { right: 16px; }
  button.px {
    font: inherit; font-size: 14px; padding: 8px 12px; cursor: pointer; color: #2a2230;
    background: #fff; border: 3px solid #2a2230; box-shadow: 3px 3px 0 #2a2230;
  }
  button.px:hover { background: #f1f7e8; }
  button.px:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2a2230; }
  #gallery { position: fixed; inset: 0; background: rgba(255,255,255,.97); overflow: auto; padding: 64px 16px 24px; box-sizing: border-box; }
  #gallery[hidden] { display: none; }
  #gallery .bar { position: fixed; top: 12px; right: 16px; display: flex; gap: 8px; }
  #gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-width: 1100px; margin: 0 auto; }
  #gallery .grid button { background: none; border: 2px solid transparent; padding: 0; cursor: pointer; }
  #gallery .grid button:hover { border-color: #2a2230; }
  #gallery .grid canvas { width: 100%; image-rendering: pixelated; display: block; }
  @media (max-width: 520px) { #info { top: 64px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info" class="hud"><div><div id="name"></div><div id="seed"></div></div></div>
<div id="buttons" class="hud">
  <button id="galleryBtn" class="px" title="Galeria (G)">▦ Galeria</button>
  <button id="restart" class="px" title="Nova granota (R)">↻ Nova granota</button>
</div>
<div id="gallery" hidden>
  <div class="bar">
    <button id="more" class="px">↻ Més</button>
    <button id="closeGal" class="px">✕</button>
  </div>
  <div class="grid"></div>
</div>
<script src="src/granota.js"></script>
<script src="src/joc.js"></script>
</body>
</html>
