<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granotes</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; color: #2a2230; }
  canvas#c { display: block; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .hud { position: fixed; top: 12px; display: flex; gap: 8px; align-items: center; }
  #info { left: 16px; font-size: 13px; line-height: 1.4; pointer-events: none; }
  #info #seed { opacity: .5; }
  #buttons { right: 16px; }
  button.px {
    font: inherit; font-size: 14px; padding: 8px 12px; cursor: pointer; color: #2a2230;
    background: #fff; border: 3px solid #2a2230; box-shadow: 3px 3px 0 #2a2230;
  }
  button.px:hover { background: #f1f7e8; }
  button.px:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2a2230; }
  #gallery { position: fixed; inset: 0; background: rgba(255,255,255,.97); overflow: auto; padding: 64px 16px 24px; box-sizing: border-box; }
  #gallery[hidden] { display: none; }
  #gallery .bar { position: fixed; top: 12px; right: 16px; display: flex; gap: 8px; }
  #gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-width: 1100px; margin: 0 auto; }
  #gallery .grid button { background: none; border: 2px solid transparent; padding: 0; cursor: pointer; }
  #gallery .grid button:hover { border-color: #2a2230; }
  #gallery .grid canvas { width: 100%; image-rendering: pixelated; display: block; }
  :root { --panel: 132px; }
  #rate { position: fixed; left: 0; top: 0; bottom: 0; width: var(--panel); padding: 12px 12px 12px 10px; box-sizing: border-box; background: #fff; border-right: 3px solid #2a2230; display: flex; }
  #partsBar { position: fixed; left: var(--panel); right: 0; bottom: 16px; display: flex; justify-content: center; padding: 0 12px; }
  #parts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .part { display: flex; align-items: stretch; background: #fff; border: 2px solid #2a2230; box-shadow: 2px 2px 0 #2a2230; font-size: 13px; }
  .part span { padding: 4px 6px 4px 8px; }
  .part button { font: inherit; border: 0; border-left: 2px solid #2a2230; background: #fff; padding: 3px 6px; cursor: pointer; }
  .part button.up { background: #bfe8a4; }
  .part button.down { background: #f4b8b8; }
  #scale { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  #scale .star { flex: 1; min-height: 0; font-size: 46px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; border-width: 3px; box-shadow: 4px 4px 0 #2a2230; }
  #scale .star:hover { background: #f1f7e8; }
  #scale .star small { font-size: 13px; margin-top: 6px; opacity: .6; }
  #scale .star:disabled { opacity: .5; cursor: default; }
  #scale .star.on { background: #2a2230; color: #fff; }
  #duelbar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 32px); }
  #duelbar[hidden], #rate[hidden], #partsBar[hidden] { display: none; }
  body.rating #info, body.rating #learn { left: calc(var(--panel) + 16px); }
  #duelbar button { font-size: 18px; padding: 12px 18px; }
  #duelBtn.on { background: #2a2230; color: #fff; }
  #learn { position: fixed; left: 16px; top: 58px; font-size: 13px; max-width: calc(100vw - 32px); }
  button.link { font: inherit; background: none; border: 0; padding: 0; cursor: pointer; color: #2a2230; text-decoration: underline; text-underline-offset: 3px; }
  #learnPanel { margin-top: 8px; background: #fff; border: 3px solid #2a2230; box-shadow: 3px 3px 0 #2a2230; padding: 10px 12px; }
  #learnPanel[hidden] { display: none; }
  #learnPanel { max-height: calc(100vh - 330px); overflow: auto; }
  #learnBody table { border-collapse: collapse; margin-bottom: 10px; }
  #learnBody td { padding: 2px 10px 2px 0; vertical-align: top; }
  #learnBody td:first-child { font-weight: bold; }
  #learnBody .n { opacity: .45; }
  #learnBody .up { color: #2f7a1f; }
  #learnBody .down { color: #b02a2a; }
  #learnBody h4 { margin: 8px 0 4px; font-size: 13px; }
  #learnPanel .actions { display: flex; gap: 16px; flex-wrap: wrap; }
  #learnPanel p { margin: 8px 0 0; opacity: .6; }
  #gallery .cell { display: flex; flex-direction: column; align-items: stretch; }
  #gallery .cell .votes { display: flex; justify-content: center; gap: 6px; }
  #gallery .cell .votes button { font-size: 13px; padding: 2px 8px; border: 2px solid #2a2230; background: #fff; cursor: pointer; }
  #gallery .cell .votes button.on { background: #2a2230; }
  @media (max-width: 520px) { :root { --panel: 86px; } #buttons { left: calc(var(--panel) + 8px); right: 8px; flex-wrap: wrap; justify-content: flex-end; gap: 6px; } #info { top: 62px; } #learn { top: 102px; } #scale { gap: 8px; } #scale .star { font-size: 34px; } #rate { padding: 8px 8px 8px 6px; } #buttons .px { padding: 6px 8px; font-size: 12px; } #duelbar button { font-size: 15px; padding: 10px 12px; } }
</style>
</head>
<body class="rating">
<canvas id="c"></canvas>
<div id="info" class="hud"><div><div id="name"></div><div id="seed"></div></div></div>
<div id="buttons" class="hud">
  <button id="duelBtn" class="px" title="Duel: tria la millor de dues (D)">⚔ Duel</button>
  <button id="galleryBtn" class="px" title="Galeria (G)">▦ Galeria</button>
  <button id="restart" class="px" title="Nova granota (R)">↻ Nova granota</button>
</div>
<div id="rate">
  <div id="scale">
    <button class="px star" data-s="5" title="M'encanta (5)">😍<small>5</small></button>
    <button class="px star" data-s="4" title="M'agrada (4)">🙂<small>4</small></button>
    <button class="px star" data-s="3" title="Normal (3)">😐<small>3</small></button>
    <button class="px star" data-s="2" title="Poc (2)">🙁<small>2</small></button>
    <button class="px star" data-s="1" title="Gens (1)">😖<small>1</small></button>
  </div>
</div>
<div id="partsBar">
  <div id="parts" title="Opcional: marca només les parts que t'agraden o no; la resta agafa la puntuació general"></div>
</div>
<div id="duelbar" hidden>
  <button class="px" data-r="a" title="Tecla ←">◀ Aquesta</button>
  <button class="px" data-r="none" title="Tecla ↓">Cap</button>
  <button class="px" data-r="both" title="Tecla ↑">Les dues</button>
  <button class="px" data-r="b" title="Tecla →">Aquesta ▶</button>
</div>
<div id="learn">
  <button id="learnBtn" class="link"></button>
  <div id="learnPanel" hidden>
    <div id="learnBody"></div>
    <div class="actions">
      <button id="exportBtn" class="link" title="Descarrega els teus vots en un fitxer">⬇ Exporta els vots</button>
      <button id="importBtn" class="link" title="Carrega vots d'un fitxer">⬆ Importa vots</button>
      <button id="forget" class="link">Oblidar els vots d'aquest navegador</button>
      <input id="importFile" type="file" accept=".json,application/json" multiple hidden>
    </div>
    <p id="baseInfo"></p>
  </div>
</div>
<div id="gallery" hidden>
  <div class="bar">
    <button id="more" class="px">↻ Més</button>
    <button id="closeGal" class="px">✕</button>
  </div>
  <div class="grid"></div>
</div>
<script src="src/granota.js"></script>
<script src="src/aprenentatge.js"></script>
<script src="src/model.js"></script>
<script src="src/gust.js"></script>
<script src="src/joc.js"></script>
</body>
</html>
